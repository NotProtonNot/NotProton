# A D3DMetal runner variant from Apple's Game Porting Toolkit evaluation environment.
#
# The header is the variant's id: picking this one writes
# NOTPROTON_RUNNER_VARIANT=d3dmetal-example into the game's launch options, and variants from
# different groups combine, sorted, as "a+b".
#
# In Steam's Developer section for the game, all records sharing variant = D3DMetal
# become a dropdown offering Default (stock CrossOver) plus each configured D3DMetal version.
#
#   label    what the dropdown shows for this entry
#   variant  the group it belongs to (D3DMetal)
#   src      the folder holding external/ and wine/
#   dst      where in the runner it goes (lib64/apple_gptk)
#
# Drop this in ~/Library/Application Support/notproton/variants/ with "src" pointing at a
# D3DMetal build or extracted evaluation environment.
[d3dmetal-example]
label   = GPTK 4.0 Beta 3
variant = D3DMetal
src     = variants/d3dmetal-4.0b3
dst     = lib64/apple_gptk

