# A runner variant. A variant is a copy of the CrossOver runner NotProton installed, with
# your own files laid over it, built the first time a game asks for it and reused after
# that. The Developer section offers one dropdown per group.
#
# The header is the variant's id: picking this one writes
# NOTPROTON_RUNNER_VARIANT=dxmt-example into the game's launch options, and variants from
# different groups combine, sorted, as "a+b".
#
#   label    what the dropdown shows for this entry; the id when left out
#   variant  the group it belongs to, which is the dropdown's own label; the id when left
#            out, so a variant on its own says its name once
#   src      the folder to lay over the runner, absolute or relative to your home folder
#   dst      where in the runner it goes, relative to the CrossOver folder
#
# Only the architecture the runner runs is taken: a src folder named x86_64-windows is
# skipped for an aarch64 runner, and the other way round.
#
# Drop this in ~/Library/Application Support/notproton/variants/ with "src" pointing at a
# build of your own.
[dxmt-example]
src = code/dxmt/build/artifacts
dst = lib/dxmt

# Give two or more records the same "variant" and they become one dropdown to choose
# between, which is what a group is for.
#
# [dxmt-upstream]
# label   = Upstream DXMT
# variant = DXMT
# src     = /opt/dxmt/artifacts
# dst     = lib/dxmt
