# A runner variant. A variant is a copy of the CrossOver runner NotProton installed,
# with your own files laid over it, built the first time a game asks for it and reused
# after that. The Developer section offers one dropdown per "variant" group, so a group
# of these files becomes a picker of builds to choose between per game.
#
# The file name is the variant's id: this file is dxmt-example, and picking it in the
# panel writes NOTPROTON_RUNNER_VARIANT=dxmt-example into the game's launch options.
# Variants from different groups combine, sorted, as "a+b".
#
# Drop this in ~/Library/Application Support/notproton/variants/ with "src" pointing at
# a build of your own.
#
#   label    what the dropdown shows for this entry
#   variant  the group it belongs to, which is the dropdown's own label
#   src      the folder to lay over the runner, absolute or relative to your home folder
#   dst      where in the runner it goes, relative to the CrossOver folder
#
# Only the architecture the runner runs is taken: a src folder named x86_64-windows is
# skipped for an aarch64 runner, and the other way round.
label   = My DXMT build
variant = DXMT
src     = code/dxmt/build/artifacts
dst     = lib/wine
