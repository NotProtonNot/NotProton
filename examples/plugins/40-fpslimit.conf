# Frame pacing for Metal backends (D3DMetal, DXMT, DXVK, WineD3D).
# Injects universal libfpslimit to meter frame submissions and pace presentation to display vblanks.
[NOTPROTON_FPS_LIMIT]
label          = FPS Limiter
description    = Hardware frame pacing for Metal (flat frametimes).
section        = dev
type           = slider
inject         = 1
requires       = Library/Application Support/notproton/libfpslimit.dylib
requires       = out/libfpslimit.dylib
default        = off
choice         = off = Off
choice         = 30 = 30 FPS
choice         = 40 = 40 FPS
choice         = 60 = 60 FPS
choice         = 120 = 120 FPS
choice         = 144 = 144 FPS
description_on = Frames are paced with sub-microsecond precision and synchronized to display refresh intervals.

# Optional sub-option: disable VSync quantization
[NOTPROTON_ENV_FPS_NO_VSYNC]
label       = FPS Limiter: disable VSync
description = Presents frames immediately on GPU finish rather than synchronizing to display refresh ticks.
depends     = NOTPROTON_FPS_LIMIT
on          = 1
off         = 0
