# A toggle with one sub-option. "off = 0" writes a value when the row is switched off
# rather than removing the launch option, which a feature that reads 0 and 1 wants.
[NOTPROTON_RENDERDOC]
label       = RenderDoc
description = Loads RenderDoc into the game so frames can be captured.
section     = dev
on          = 1
inject      = 1
requires    = code/github/renderdoc/build-metal-make/lib/librenderdoc.dylib

[NOTPROTON_ENV_RENDERDOC_HOOK_EGL]
label       = RenderDoc: hook EGL
description = Also hook EGL. Only needed for games that render through ANGLE.
depends     = NOTPROTON_RENDERDOC
on          = 1
off         = 0
