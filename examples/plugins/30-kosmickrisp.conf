# Mesa's Vulkan-on-Metal driver in place of MoltenVK, as one toggle that both injects a
# dylib and sets two environment variables.
#
# No DYLD_LIBRARY_PATH is needed: the staged loader's install name is libMoltenVK.dylib,
# which is the soname win32u asks for, so inserting it satisfies Wine's dlopen outright.
# The loader and the driver are both universal, so one "requires" serves x86_64 and arm64
# Wine alike.
[NOTPROTON_KOSMICKRISP]
label       = KosmicKrisp (Mesa Vulkan)
description = Use Mesa's Vulkan-on-Metal driver instead of MoltenVK. Experimental.
section     = dev
on          = 1
off         = 0
inject      = 1
requires    = .local/share/kosmickrisp/libMoltenVK.dylib
env         = VK_DRIVER_FILES=~/.local/share/kosmickrisp/icd.json
# KosmicKrisp implements no geometry shaders and no longer claims them by default.
# DOOM Eternal does not start without the claim; measured, it fails to come up.
env         = KK_FAKE_GEOMETRY_SHADER=1
