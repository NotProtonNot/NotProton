# A feature and its settings in one file, which is what a section header is for: eight
# rows that belong together, in the order they appear here.
#
# These are the real descriptors behind FrameScope (github.com/natbro/framescope), not
# invented ones. Point "requires" at your own build and the rows come alive; leave it and
# they show greyed out as "(not installed)", which is what a plugin for something you have
# not built yet is meant to look like.

# A toggle. "inject = 1" loads the file "requires" found into the game, and each "env" is
# exported for it. The "description_on" lines appear under the description only while the
# row is on, which suits what a feature offers once it is actually running.
[NOTPROTON_FRAMESCOPE]
label          = FrameScope
description    = Adds the FrameScope HUD, supporting resolution-scaling, frame-pacing, and HDR features.
section        = dev
on             = 1
inject         = 1
env            = FRAMESCOPE=1
requires       = code/github/framescope/build/libframescope.dylib
description_on = In game, hold Ctrl+Opt and press: H to hide the HUD, ; for compact, D to cycle detail, G for the frame-time graph.
description_on = HDR, where the display has it: E cycles the mode, J/K the peak, U/I the midtone gain, 8/9 the shadow lift, V the color analysis.
description_on = B starts and stops the benchmark CSV, L records input, Y replays it, R writes a report to the log.

# A dropdown. "depends" hides it until FrameScope is on and indents it underneath.
# "choice = <value> = <label>" splits at the first =, so the value is what reaches the
# game and the label is what Steam shows. Default writes no launch option at all.
[NOTPROTON_ENV_FRAMESCOPE_POSITION]
label       = HUD position
description = Which corner of the screen the HUD is drawn in. Ctrl+Opt+P moves it in game.
type        = choice
depends     = NOTPROTON_FRAMESCOPE
choice      = tl = Top left
choice      = tr = Top right
choice      = bl = Bottom left
choice      = br = Bottom right

# A slider over a range. "default" is where the handle sits while the launch option is
# unset, and sliding back onto it clears the option again, so Default stays reachable.
# "suffix" is joined straight onto the value, with no space of its own.
[NOTPROTON_ENV_FRAMESCOPE_SCALE]
label       = HUD text size
description = Scales the HUD's text and panels.
type        = slider
depends     = NOTPROTON_FRAMESCOPE
min         = 0.5
max         = 2
step        = 0.05
default     = 1
suffix      = x

# A slider given values instead of a range snaps to them, with a labelled tick under
# each. These are the rates FrameScope's own Ctrl+Opt+[ and ] step through.
[NOTPROTON_ENV_FRAMESCOPE_HZ]
label       = Frame pacing target
description = Paces presents to this rate. Off lets the game run as fast as it can. Ctrl+Opt+[ and ] step it in game, Ctrl+Opt+0 turns it off.
type        = slider
depends     = NOTPROTON_FRAMESCOPE
default     = off
choice      = off = Off
choice      = 30 = 30 Hz
choice      = 40 = 40 Hz
choice      = 48 = 48 Hz
choice      = 50 = 50 Hz
choice      = 60 = 60 Hz
choice      = 80 = 80 Hz
choice      = 120 = 120 Hz

# A sub-option of a sub-option: "depends" names the slider above, which holds a value
# rather than being on or off, so this appears once that slider leaves Default -- and it
# indents twice, since the chain runs two deep.
[NOTPROTON_ENV_FRAMESCOPE_PACE_MODE]
label       = Pacing mode
description = How the target is held: a minimum frame duration, or a presentation time per frame. Ctrl+Opt+M switches it in game.
type        = choice
depends     = NOTPROTON_ENV_FRAMESCOPE_HZ
choice      = duration = Minimum duration
choice      = attime = Scheduled time

[NOTPROTON_ENV_FRAMESCOPE_DRAWABLE_SCALE]
label       = Drawable scale
description = Renders the game at a fraction of the window's size and scales it up on present. Ctrl+Opt+- and Ctrl+Opt+= step it in game.
type        = slider
depends     = NOTPROTON_FRAMESCOPE
default     = 1
choice      = 0.5 = 50%
choice      = 0.67 = 67%
choice      = 0.75 = 75%
choice      = 0.85 = 85%
choice      = 1 = 100%

[NOTPROTON_ENV_FRAMESCOPE_HDR_COLORSPACE]
label       = HDR color space
description = The color space the HDR modes present in. Ctrl+Opt+C cycles it in game.
type        = choice
depends     = NOTPROTON_FRAMESCOPE
choice      = srgb = sRGB
choice      = p3 = Display P3
choice      = 2020 = Rec. 2020

[NOTPROTON_ENV_FRAMESCOPE_HDR_GAMUT]
label       = HDR gamut expansion
description = How far saturated colors are pushed towards the wider gamut. No effect with sRGB. Ctrl+Opt+, and Ctrl+Opt+. step it in game.
type        = slider
depends     = NOTPROTON_FRAMESCOPE
min         = 0
max         = 1
step        = 0.05
default     = 0
