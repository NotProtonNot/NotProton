# A slider that snaps to declared values. Give "type = slider" a list of values
# instead of a min/max range and the handle steps from one to the next, with a
# labelled tick under each. Useful when only certain values mean anything.
#
# "default" has to be one of the values, since that is where an unset launch option
# puts the handle.
key         = NOTPROTON_ENV_MVK_CONFIG_LOG_LEVEL
label       = Example: MoltenVK log level
description = How much MoltenVK writes to the game's log.
section     = dev
type        = slider
default     = 1
choice      = 0 = None
choice      = 1 = Errors
choice      = 2 = Warnings
choice      = 3 = Info
choice      = 4 = Debug
