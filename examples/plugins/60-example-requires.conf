# A plugin that needs a file. Each "requires" is a path, absolute or relative to your
# home folder; the first one that exists is the one the plugin uses, so several lines
# are an any-of. A row whose files are all missing still appears, but greyed out and
# labelled "(not installed)", which is how a plugin for a build you have not made yet
# is meant to look.
#
# "inject = 1" loads that file into the game with DYLD_INSERT_LIBRARIES. Drop this
# file in as it is to see the not-installed state; point "requires" at a dylib you
# have built to see it come alive.
key         = NOTPROTON_EXAMPLE_INJECT
label       = Example: load a dylib into the game
description = Loads the dylib named below into every game this plugin is on for.
section     = dev
on          = 1
inject      = 1
requires    = code/example/build/libexample.dylib
