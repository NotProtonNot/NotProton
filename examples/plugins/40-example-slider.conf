# A slider over a range. "min" and "max" are required and "max" has to be the larger;
# "step" is what the handle moves by, and "default" is where the handle sits while the
# launch option is unset. Sliding back onto the default clears the launch option, so
# Default is always reachable.
#
# Only the finished value is written, not every position the handle passes through.
#
# "suffix" draws text after the value, joined straight on with no space of its own, so
# it suits units written that way:
#   suffix = x        1.25x
#   suffix = %        75%
key         = NOTPROTON_ENV_DXVK_FRAME_RATE
label       = Example: DXVK frame rate cap
description = Caps the frame rate in DXVK. 0 leaves it uncapped.
section     = dev
type        = slider
min         = 0
max         = 240
step        = 10
default     = 0
