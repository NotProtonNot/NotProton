# A sub-option. "depends" names another plugin's key: this row is hidden until that
# one is on, and is indented under it. Chains are followed the whole way up, so a
# sub-option of a sub-option is hidden with its grandparent and indents twice.
#
# Plugins are read in file-name order and each "env" is exported in that order, so
# this file's DXVK_HUD wins over 10-example-toggle.conf's while it is on.
key         = NOTPROTON_EXAMPLE_DXVK_HUD_FULL
label       = Everything, not just the frame rate
description = Switches the HUD to DXVK's full set of counters.
section     = dev
depends     = NOTPROTON_EXAMPLE_DXVK_HUD
on          = 1
off         = 0
env         = DXVK_HUD=full
