# A toggle. The simplest plugin there is: a switch in the Developer section that
# exports an environment variable for the game when it is on.
#
# "key" is the launch option the switch writes, and has to start with NOTPROTON_.
# "on" is the value that counts as on (1 unless it says otherwise); "off" is what is
# written when it is switched off, and an empty one removes the launch option.
key            = NOTPROTON_EXAMPLE_DXVK_HUD
label          = Example: DXVK HUD
description    = Draws DXVK's own HUD. Only does anything with the DXVK graphics backend.
section        = dev
on             = 1
env            = DXVK_HUD=fps

# Lines that appear under the description only while the row is on. Good for the keys
# or files a feature offers once it is running, which are noise while it is off.
description_on = The HUD is drawn by DXVK itself, so it appears once the game starts.
