# A dropdown. "type = choice" turns the row into Steam's own dropdown, offering
# Default plus each value declared below. Default writes no launch option at all.
#
# "choice = <value> = <label>" splits on the first =, so the value reaches the game
# and the label is what the dropdown shows. A choice with no label shows its value.
key         = NOTPROTON_ENV_WINEDEBUG
label       = Example: Wine debug channels
description = What Wine writes to the game's log.
section     = dev
type        = choice
choice      = -all = Silent
choice      = fixme-all = Hide fixme messages
choice      = warn+all = Every warning
choice      = +loaddll = Which DLLs are loaded
