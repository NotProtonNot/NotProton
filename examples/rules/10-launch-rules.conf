# Launch rules: words to pass a particular game, in a file rather than in the binary.
#
# The command that gets a game past its own launcher, or off a renderer that nothing here
# translates, is something people find out one game at a time. NotProton ships almost none
# of them on purpose: a flag that helps one game does nothing for the next one and can
# stop a third from starting. What it ships is this file format, so a flag somebody has
# actually tested can be added without a build, and passed around as a file.
#
# Drop a copy in ~/Library/Application Support/notproton/rules/ and it applies at the next
# launch. The arguments are added to the ones the game is already being given, never
# instead of them: a flag that is already on the game's launch options is not added twice,
# and the no-auto-settings file in the support folder turns the whole thing off.
#
# A record matches only when everything it names matches, so name as little as says which
# game you mean. The fields:
#
#   appid     Steam's number for the game, as in the store URL. May be given more than
#             once, and then any of them matches.
#   engine    unreal or unity, when the rule is about what the engine does.
#   launcher  ea, ubisoft, epic or rockstar, when it is about the launcher in the way.
#   exe       the executable NotProton picked, by name, if the rule is only for one build.
#   option    a word to pass the game. Repeat it for more than one. One word each, no
#             quoting: a value with a space in it is not something this passes on.
#   note      a sentence added to what the game's badge says when you hover it.
#
# A record that names no game at all is refused rather than applied to everything, and so
# is one that names a game but has nothing to pass it.

# Unreal's startup movies cannot be skipped from the game's own menu, and the engine has
# taken this switch for years. Harmless where the game has no movies to skip.
[unreal-skip-startup-movies]
label  = Unreal: skip the startup movies
engine = unreal
option = -nostartupmovies

# An example of the shape a bypass takes, not a flag to trust: 271590 is Grand Theft Auto V
# and the words below are the ones you would have found to work. Put your own appid and
# your own flag here. Delete this record if you are not sure of it -- a wrong flag is a
# game that will not start.
#
# [gta-v-skip-launcher]
# label    = Grand Theft Auto V: straight into the game
# appid    = 271590
# option   = -skipRockstarLauncher
# note     = Started without the Rockstar launcher.

# A rule does not have to pass anything. One that only carries a note is a way to leave
# yourself a sentence on the game's badge about what you had to do to make it work.
#
# [mass-effect-le-prefix-note]
# appid = 1328670
# note  = Install the EA app inside this game's prefix before the first launch.
