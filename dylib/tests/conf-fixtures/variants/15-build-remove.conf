# A variant that changes Wine itself names the builds it was made for, as many as it serves.
[wine-fix]
label  = Wine fix
src    = code/wine-fix/artifacts
dst    = lib/wine
build  = 27.0.0.41073
build  = 27.0.0.41073-fex

# Files can be removed as well as laid over, and dst may be the CrossOver folder itself.
[trimmed]
src    = code/trimmed
dst    = .
remove = lib/wine/x86_64-windows/winegstreamer.dll
remove = ./lib/wine/x86_64-unix/winegstreamer.so
