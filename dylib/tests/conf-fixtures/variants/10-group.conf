# Two builds of the same thing, one dropdown, one file.
[dxmt-mine]
label   = My DXMT build
variant = DXMT
src     = code/dxmt/build/artifacts
dst     = lib/wine

[dxmt-upstream]
label   = Upstream DXMT
variant = DXMT
src     = /opt/dxmt/artifacts
dst     = lib/wine

# Neither label nor variant is required: both fall back to the id, so a variant on its
# own says its name once.
[plain]
src = code/plain
dst = lib/wine
