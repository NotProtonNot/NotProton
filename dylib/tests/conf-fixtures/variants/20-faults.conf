[no-src]
label   = No src
variant = DXMT
dst     = lib/wine
[escapes]
label   = Escapes the runner
variant = DXMT
src     = code/x
dst     = ../../elsewhere
[absolute]
label   = Absolute dst
variant = DXMT
src     = code/x
dst     = /tmp/elsewhere
[stranger]
label   = Unknown field
variant = DXMT
src     = code/x
dst     = lib/wine
tools   = notproton-26.3
[BAD ID]
label   = Space in the id
variant = DXMT
src     = code/x
dst     = lib/wine
[bad-build]
src   = code/x
dst   = lib/wine
build = 27.0 beta
[escaping-remove]
src    = code/x
dst    = lib/wine
remove = ../../bin/wineserver
[absolute-remove]
src    = code/x
dst    = lib/wine
remove = /usr/lib/libSystem.B.dylib
[remove-nothing]
src    = code/x
dst    = lib/wine
remove = ./
