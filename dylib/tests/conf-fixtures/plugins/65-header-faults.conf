# An empty header is refused against the file, and takes nothing of its own into the
# record after it. An id or a field name too long to hold is named as far as it is held.
[ ]
label = Stray
[NOTPROTON_AFTER_EMPTY]
label = After
[NOTPROTON_LLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLLL]
label = Long id
[NOTPROTON_LONG_FIELD]
label = Long field
ffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffffff = 1
[NOTPROTON_NO_NAME]
label = No name
= value
