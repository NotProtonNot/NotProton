# A feature and its sub-options in one file, which is the point of sections.
[NOTPROTON_HUD]
label       = Hud
description = Draws a HUD.
requires    = code/hud/build/libhud.dylib
inject      = 1
env         = HUD=1
description_on = Ctrl+Opt+H hides it.
description_on = Ctrl+Opt+G draws the graph.

[NOTPROTON_ENV_HUD_POS]
label   = HUD position
type    = choice
depends = NOTPROTON_HUD
choice  = tl = Top left
choice  = tr

[NOTPROTON_ENV_HUD_SCALE]
label   = HUD size
type    = slider
depends = NOTPROTON_HUD
min     = 0.5
max     = 2
step    = 0.05
default = 1
suffix  = x

[NOTPROTON_ENV_HUD_HZ]
label   = Pacing
type    = slider
depends = NOTPROTON_HUD
default = off
choice  = off = Off
choice  = 60 = 60 Hz
