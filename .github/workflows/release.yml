name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release
        required: true
        type: string
      release_notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/app.yml

  release:
    name: publish release
    needs: build
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: NotProton
          path: release

      - name: Verify the archive
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ditto -x -k release/NotProton.zip release/extracted
          codesign --verify --strict release/extracted/NotProton.app
          actual=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' release/extracted/NotProton.app/Contents/Info.plist)
          test "$actual" = "$VERSION"
          make -s mincheck APP_BUNDLE=release/extracted/NotProton.app

      - name: Resolve Sparkle tools
        run: swift package resolve --package-path app

      - name: Generate the appcast
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ inputs.version }}
        run: |
          gh api markdown -f text="$RELEASE_NOTES" -f mode=gfm -f context="$GITHUB_REPOSITORY" > release/NotProton.html
          printf '%s' "$SPARKLE_PRIVATE_KEY" | app/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/" \
            --embed-release-notes \
            release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name NotProtonNot
          git config user.email 332734261+NotProtonNot@users.noreply.github.com
          git tag -f -a "v$VERSION" -m "Public release/$VERSION"
          git push --force origin "v$VERSION"
          gh release delete "v$VERSION" --yes || true
          gh release create "v$VERSION" \
            release/NotProton.zip \
            release/appcast.xml \
            --title "$VERSION" \
            --notes "$RELEASE_NOTES"
