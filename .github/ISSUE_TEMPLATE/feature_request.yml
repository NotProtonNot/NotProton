name: Feature request
description: An idea for something NotProton should do.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the idea! Please check the [open issues](https://github.com/NotProtonNot/NotProton/issues) and [closed issues](https://github.com/NotProtonNot/NotProton/issues?q=is%3Aissue%20is%3Aclosed) first, since the feature may already have been suggested or considered.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Tell us what's getting in your way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Optional. Got a fix in mind? Describe it here.
